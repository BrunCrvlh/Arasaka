{% extends "base.html" %}
{% block conteudo %}
<h1>Agências</h1>
<div class="card"><h3>Nova agência</h3>
  <form method="post"><div class="row">
    <div><label>Código</label><input name="codigo" required></div>
    <div><label>Nome</label><input name="nome" required></div>
    <div><label>Cidade</label><input name="cidade" required></div>
  </div><button>Cadastrar</button></form></div>
<div class="card"><div class="scroll"><table><tr><th>Código</th><th>Nome</th><th>Cidade</th></tr>
  {% for a in agencias %}<tr><td>{{ a['Codigo da agencia'] }}</td><td>{{ a['Nome da agencia'] }}</td><td>{{ a['Cidade'] }}</td></tr>
  {% else %}<tr><td colspan="3" class="mut">Nenhuma agência cadastrada.</td></tr>{% endfor %}
</table></div></div>
{% endblock %}
