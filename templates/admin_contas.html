{% extends "base.html" %}
{% block conteudo %}
<h1>Contas</h1>
<div class="card"><form method="get" style="display:flex;gap:12px;align-items:end;flex-wrap:wrap">
  <div style="flex:1;min-width:200px"><label>Filtrar por CPF (vazio = todas)</label><input name="cpf" value="{{ filtro }}"></div>
  <button style="margin:0">Filtrar</button></form></div>
<div class="card"><div class="scroll"><table><tr><th>Nº</th><th>CPF</th><th>Agência</th><th>Tipo</th><th>Saldo</th></tr>
  {% for c in contas %}<tr><td>{{ c['numero'] }}</td><td>{{ c['cpf'] }}</td><td>{{ c['codigo_agencia'] }}</td><td>{{ c['tipo'] }}</td><td>{{ c['saldo']|brl }}</td></tr>
  {% else %}<tr><td colspan="5" class="mut">Nenhuma conta encontrada.</td></tr>{% endfor %}
</table></div></div>
{% endblock %}
