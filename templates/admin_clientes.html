{% extends "base.html" %}
{% block conteudo %}
<h1>Clientes</h1>
<div class="card"><div class="scroll"><table><tr><th>Nome</th><th>CPF</th></tr>
  {% for c in clientes %}<tr><td>{{ c['Nome'] }}</td><td>{{ c['CPF'] }}</td></tr>
  {% else %}<tr><td colspan="2" class="mut">Nenhum cliente cadastrado.</td></tr>{% endfor %}
</table></div></div>
{% endblock %}
