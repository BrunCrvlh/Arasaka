{% extends 'base.html' %}{% block conteudo %}<div class="titulo-linha"><div><p class="sobretitulo">GERÊNCIA / AGÊNCIAS</p><h1>Agências do banco.</h1><p>Cadastre as unidades disponíveis para abrir contas.</p></div></div><section class="card"><h2>Nova agência</h2><form method="post"><div class="grade tres"><div><label for="codigo">Código exclusivo</label><input id="codigo" name="codigo" placeholder="Ex.: 002" value="{{ request.form.get('codigo', '') }}" required></div><div><label for="nome">Nome da agência</label><input id="nome" name="nome" value="{{ request.form.get('nome', '') }}" required></div><div><label for="cidade">Cidade</label><input id="cidade" name="cidade" value="{{ request.form.get('cidade', '') }}" required></div></div><button class="btn" type="submit">Cadastrar agência →</button></form></section><section class="card"><h2>Unidades cadastradas</h2><div class="tabela-scroll"><table><thead><tr><th>Código</th><th>Nome</th><th>Cidade</th></tr></thead><tbody>{% for a in agencias %}<tr><td>{{ a.codigo }}</td><td>{{ a.nome }}</td><td>{{ a.cidade }}</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
